services:  
  db:  
    image: postgres:latest  
    container_name: postgres_db  
    ports:  
      - "5432:5432"  
    environment:  
      POSTGRES_USER: postgres  
      POSTGRES_PASSWORD: postgres  
      POSTGRES_DB: organise  
    volumes:  
      - postgres_data:/var/lib/postgresql/data  
    networks:  
      - my_network

  redis:
    image: redis:latest
    ports:
      - "6380:6379"  

volumes:  
  postgres_data:  

networks:  
  my_network:  