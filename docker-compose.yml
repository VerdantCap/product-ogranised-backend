services:  
  db:  
    image: postgres:latest  
    container_name: postgres_db  
    ports:  
      - "5432:5432"  
    environment:  
      POSTGRES_USER: postgres  
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: organise  
    volumes:  
      - postgres_data:/var/lib/postgresql/data  
    networks:  
      - my_network

  redis:
    image: redis:latest
    ports:
      - "6380:6379"
    networks:
      - my_network

  minio:
    image: bitnami/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
      - MINIO_DEFAULT_BUCKETS=public:public,files-bucket:public
      - MINIO_API_PORT_NUMBER=9000
      - MINIO_CONSOLE_PORT_NUMBER=9001
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - my_network

volumes:  
  postgres_data:
  minio_data:

networks:  
  my_network:
