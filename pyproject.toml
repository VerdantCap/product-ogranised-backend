[project]
name = "product-organised-backend"
version = "0.1.0"
description = "Orgasnied-AI Product Backend"
authors = [
    {name = "VerdantCap"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.115.6,<0.116.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "sqlalchemy (>=2.0.37,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "prometheus-client (>=0.21.1,<0.22.0)",
    "asyncio (>=3.4.3,<4.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "pydantic-settings (>=2.7.1,<3.0.0)",
    "types-redis (>=4.6.0.20241004,<5.0.0.0)",
    "redis (>=5.2.1,<6.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "aiosmtplib (>=3.0.2,<4.0.0)",
    "pytz (>=2024.2,<2025.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "tzlocal (>=5.2,<6.0)",
    "aiohttp (>=3.11.11,<4.0.0)",
    "dateparser (>=1.2.0,<2.0.0)",
    "apscheduler (>=3.11.0,<4.0.0)",
    "backoff (>=2.2.1,<3.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "openapi-core (>=0.19.4,<0.20.0)",
    "alembic (>=1.14.1,<2.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "stripe (>=11.4.1,<12.0.0)",
    "fastapi-sso (>=0.17.0,<0.18.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
